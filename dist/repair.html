<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日本地理マスター・起動の修復</title><style>body{font:16px system-ui;background:#f7f8f2;color:#183f3b;max-width:480px;margin:80px auto;padding:24px;line-height:1.9}button{font:inherit;background:#176d60;color:white;border:0;padding:16px 24px;border-radius:12px;cursor:pointer}a{color:#176d60}</style><h1>起動の修復</h1><p>古いオフライン用キャッシュを解除して、ゲームを開き直します。保存済みのプレイヤーや学習記録には触れません。</p><button id="repair">修復してゲームを開く</button><p id="status" role="status"></p><script>document.getElementById('repair').onclick=async function(){this.disabled=true;document.getElementById('status').textContent='起動用データを更新しています…';try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.filter(r=>r.scope===new URL('./',location.href).href).map(r=>r.unregister()))}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.filter(k=>k.startsWith('nihon-chiri-')).map(k=>caches.delete(k)))}location.replace('./?repaired=1')}catch(e){document.getElementById('status').textContent='修復できませんでした。通信を確認して、もう一度お試しください。';this.disabled=false}};</script></html>
