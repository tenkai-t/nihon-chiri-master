<!doctype html><meta charset="utf-8"><title>ヒント・モバイル幅の実ブラウザ検証</title><style>body{margin:10px;font:14px sans-serif;background:#e9ecea}button{padding:8px;margin:3px}iframe{display:block;border:1px solid #aaa;background:white;width:390px;height:844px}</style><h1 style="font-size:18px">モバイル幅の検証（実機・OSキーボードの検証ではありません）</h1><p><button data-w="390" data-h="844">390×844</button><button data-w="375" data-h="667">375×667</button><button data-w="844" data-h="390">844×390</button><button data-w="320" data-h="568">320×568</button><button data-w="390" data-h="450">キーボード相当の高さ</button></p><iframe id="game" src="/" title="日本地理マスター・モバイル幅"></iframe><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{const f=document.querySelector('iframe');f.style.width=b.dataset.w+'px';f.style.height=b.dataset.h+'px';});</script>
